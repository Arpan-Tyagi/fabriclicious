name: Production Security & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security-and-typecheck:
    name: TypeScript Strict & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

  automated-security-and-integration-tests:
    name: Concurrency Red-Team & Integration Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Formula Injection & GST 2.0 Unit Tests
        run: npx tsx --test tests/unit/exportSanitizer.test.mjs tests/unit/gstInvoice.test.mjs

      - name: Run Webhooks & Multi-Channel CRM Integration Tests
        run: npx tsx --test tests/integrations/razorpay.test.mjs tests/integrations/metaGoogleCrm.test.mjs

      - name: Run Adversarial Concurrency Red-Team Harness
        run: npx tsx --test tests/security-redteam/concurrency.test.mjs

  production-build-verification:
    name: Next.js Production Build Compilation
    runs-on: ubuntu-latest
    needs: [static-security-and-typecheck, automated-security-and-integration-tests]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
      SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key
      NEXT_PUBLIC_RAZORPAY_KEY_ID: dummy_key
      RAZORPAY_KEY_SECRET: dummy_secret
      RESEND_API_KEY: dummy_resend
      META_APP_SECRET: dummy_meta
      WHATSAPP_PHONE_NUMBER_ID: dummy_phone_id
      WHATSAPP_ACCESS_TOKEN: dummy_token
      WHATSAPP_VERIFY_TOKEN: dummy_verify
      GEMINI_API_KEY: dummy_gemini
      KV_URL: https://dummy.kv
      KV_REST_API_URL: https://dummy.kv
      KV_REST_API_TOKEN: dummy_token
      KV_REST_API_READ_ONLY_TOKEN: dummy_token
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile Next.js Production Bundle
        run: npm run build
